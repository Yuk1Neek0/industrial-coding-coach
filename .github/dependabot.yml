version: 2
updates:
  # JavaScript / TypeScript dependencies (pnpm workspace, discovered from root)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # eslint v10 + @eslint/js v10 are blocked upstream: eslint-plugin-react@7.37.5
      # (latest) has peerDependencies eslint "^3 || ^4 || ^5 || ^6 || ^7 || ^8 || ^9.7".
      # Re-evaluate when eslint-plugin-react ships a release with eslint ^10 support.
      # See closed PRs #18 and #19.
      - dependency-name: "eslint"
        versions: ["10.x"]
      - dependency-name: "@eslint/js"
        versions: ["10.x"]

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
