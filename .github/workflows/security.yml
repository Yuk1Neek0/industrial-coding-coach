name: Security

on:
  push:
    branches: [main]
  pull_request:
    # See note in ci.yml — task PRs targeting epic/* branches need the same
    # security gate as main-targeted PRs.
    branches: [main, "epic/**"]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Run the official gitleaks binary directly instead of
      # gitleaks/gitleaks-action: the action calls the GitHub API for PR
      # commits and crashes with HTTP 403 on Dependabot PRs (read-only token).
      # The binary scans the local git history and needs no API access.
      - name: Run Gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose \
            --exit-code 1
