name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Trigger on PRs into main AND into any epic/* branch.
    # Task-level PRs target the parent epic branch (ADR 0008); without the
    # epic/** glob those PRs would merge with zero CI verification.
    branches: [main, "epic/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        # pnpm version is read from "packageManager" in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
